<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>醉翁亭記：快速彈出沉浸版</title>
    <style>
        :root {
            --depth: 0px;
            --move-speed: 2s; /* 維持位移的平穩感 */
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            color: #fff;
            font-family: "Noto Serif TC", serif;
            overflow: hidden;
        }

        /* --- 階段一：地圖層 --- */
        #map-stage {
            position: fixed;
            width: 100vw; height: 100vh;
            background-image: url('img/map.webp');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            transition: transform 1.5s ease-in, opacity 1s;
        }

        /* --- 階段二：穿梭層 --- */
        #explore-stage {
            display: none;
            width: 100vw; height: 100vh;
            perspective: 600px;
            perspective-origin: 50% 50%;
        }

        #scene {
            position: relative;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            /* 這裡負責 3D 穿梭 */
            transition: transform var(--move-speed) cubic-bezier(0.1, 0, 0.2, 1);
            transform: translateZ(var(--depth));
        }

        .layer {
            position: absolute;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-size: cover; background-position: center;
            opacity: 0;
            filter: blur(10px) brightness(0.6);
            /* 關鍵：縮短圖片浮現時間，讓它「彈出來」 */
            transition: opacity 0.8s ease-out, filter 0.8s ease-out;
            pointer-events: none;
        }

        /* 當前活躍場景：快速變清晰 */
        .layer.active {
            opacity: 1 !important;
            filter: blur(0px) brightness(1) !important;
            pointer-events: auto;
        }

        #layer1 { transform: translateZ(0px); background-image: url('img/scene1.webp'); }
        #layer2 { transform: translateZ(-1500px); background-image: url('img/scene2.webp'); }
        #layer3 { transform: translateZ(-3000px); background-image: url('img/scene3.webp'); }
        #layer4 { transform: translateZ(-4500px); background-image: url('img/scene4.webp'); }
        #layer5 { transform: translateZ(-6000px); background-image: url('img/scene5.webp'); }

        /* --- 呼吸白圈樣式 --- */
        .landmark {
            position: fixed;
            cursor: pointer;
            text-align: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .landmark-icon {
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .content {
            background: rgba(0, 0, 0, 0.4);
            padding: 1.5rem 2.5rem; border-radius: 5px;
            backdrop-filter: blur(10px); text-align: center;
            pointer-events: none;
        }

        #btn-start { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #btn-next { bottom: 10%; right: 10%; }
        
        .hidden { opacity: 0; pointer-events: none; }

        button {
            padding: 8px 16px; font-family: inherit; cursor: pointer;
            background: #fff; border: none; margin-top: 10px;
			pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="map-stage">
        <div id="btn-start" class="landmark" onclick="startExplore()">
            <div class="landmark-icon"></div>
            <h3>瑯琊山</h3>
            <p>開始遊歷</p>
        </div>
    </div>

    <div id="explore-stage">
        <div id="scene">
            <div id="layer1" class="layer">
                <div class="content"><h1>環滁皆山也</h1><p>連綿山群環繞滁州</p></div>
            </div>
            <div id="layer2" class="layer">
                <div class="content"><h1>西南諸峰</h1><p>林壑尤美</p></div>
            </div>
            <div id="layer3" class="layer">
                <div class="content"><h1>瑯琊山</h1><p>望之蔚然而深秀者</p></div>
            </div>
            <div id="layer4" class="layer">
                <div class="content"><h1>讓泉</h1><p>山行六七里，漸聞水聲潺潺</p></div>
            </div>
            <div id="layer5" class="layer">
                <div class="content"><h1>醉翁亭</h1><p>有亭翼然臨於泉上者</p><button onclick="location.reload()">重新開始</button></div>
            </div>
        </div>

        <div id="btn-next" class="landmark hidden" onclick="moveNext()">
            <div class="landmark-icon"></div>
            <p>向深處行</p>
        </div>
    </div>

    <script>
        let step = 0;
        const dist = 1500;
        const mapStage = document.getElementById('map-stage');
        const exploreStage = document.getElementById('explore-stage');
        const btnNext = document.getElementById('btn-next');
        const layers = document.querySelectorAll('.layer');

        function startExplore() {
            mapStage.style.transform = "scale(3)";
            mapStage.style.opacity = "0";
            
            setTimeout(() => {
                mapStage.style.display = "none";
                exploreStage.style.display = "block";
                updateLayers();
                btnNext.classList.remove('hidden');
            }, 1000);
        }

        function moveNext() {
            if (step < 4) {
                step++;
                // 立即更新 3D 位置
                document.documentElement.style.setProperty('--depth', (step * dist) + 'px');
                
                // 立即更新圖片狀態：0.8秒內就會彈出清晰圖片
                updateLayers();

                // 隱藏白圈
                btnNext.classList.add('hidden');
                
                // 等移動動畫快結束，再次顯示按鈕
                setTimeout(() => {
                    if(step < 4) btnNext.classList.remove('hidden');
                }, 3000); 
            }
        }

        function updateLayers() {
            layers.forEach((layer, i) => {
                if (i === step) layer.classList.add('active');
                else layer.classList.remove('active');
            });
        }
    </script>
</body>
</html>
