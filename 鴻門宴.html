<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鴻門風雲：楚漢雙雄抉擇錄</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --primary-red: #8b0000;
            --accent-gold: #d4af37;
            --danger-color: #ff4d4d;
            --light-bg: #3a3a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #3d3d3d;
        }

        #status-bar {
            padding: 15px;
            background-color: #111;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-bottom: 2px solid var(--accent-gold);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-bar {
            width: 70px;
            height: 10px;
            background-color: #444;
            border-radius: 5px;
            overflow: hidden;
            display: inline-block;
        }

        .progress-fill {
            height: 100%;
            width: 50%;
            transition: width 0.3s ease;
        }

        #stat1-fill { background-color: var(--danger-color); }
        #stat2-fill { background-color: var(--accent-gold); }

        #stage-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        #chapter-title {
            font-size: 18px;
            color: var(--accent-gold);
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #character-avatar {
            font-size: 64px;
            margin: 15px 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        #story-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 0 10px;
            word-wrap: break-word;
            overflow-y: auto;
            flex: 1;
        }

        #action-area {
            padding: 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #3d3d3d;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #3a3a3a;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
            background-color: var(--primary-red);
            border-color: var(--accent-gold);
        }

        .btn-liubang { background-color: #1e3f20; border-color: #2e5f30; }
        .btn-xiangyu { background-color: #4a1515; border-color: #6a1f1f; }

        #custom-message-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        #custom-message-box {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            max-width: 90%;
        }

        #message-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        #message-close-btn {
            background-color: var(--light-bg);
            border: 1px solid #777;
            padding: 10px 30px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* === 座位排陣樣式 === */
        #seating-level-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        #character-source-zone {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            min-height: 72px; /* 確保隱藏時高度不塌陷 */
        }

        .draggable-character {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: grab;
            padding: 5px;
            border: 2px solid transparent;
            border-radius: 4px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .draggable-character:active {
            cursor: grabbing;
        }

        /* 當角色被安置到座位上時，上方來源區隱藏 */
        .draggable-character.placed {
            visibility: hidden;
            pointer-events: none;
        }

        .char-avatar {
            font-size: 32px;
        }

        .char-name {
            font-size: 11px;
            color: #aaa;
        }

        #seating-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 280px;
            height: 240px;
            margin: 10px auto;
            border: 2px dashed #555;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            position: relative;
        }

        .seat-slot {
            background-color: #444;
            border: 1px dashed var(--accent-gold);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #aaa;
            position: relative;
            transition: background-color 0.2s;
        }

        .seat-slot.drag-over {
            background-color: rgba(139, 0, 0, 0.4);
        }

        .seat-slot.occupied {
            background-color: #5c1d1d;
            color: #fff;
            font-weight: bold;
            border-style: solid;
            cursor: grab; /* 讓座位上的角色也可以被拖移 */
        }

        .seat-slot.occupied:active {
            cursor: grabbing;
        }

        .seat-slot.occupied .drop-slot-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .seat-slot.occupied .char-avatar { font-size: 24px; }
        .seat-slot.occupied .char-name { font-size: 12px; color: #fff; }

        .seat-center {
            background-color: #333;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .flash {
            animation: flash-animation 0.2s ease-out 2;
        }

        @keyframes flash-animation {
            0% { background-color: var(--card-bg); }
            50% { background-color: rgba(139, 0, 0, 0.6); }
            100% { background-color: var(--card-bg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <div class="stat">
            <span id="stat1-label">指標 A:</span>
            <div class="progress-bar"><div id="stat1-fill" class="progress-fill"></div></div>
            <span id="stat1-val">--</span>
        </div>
        <div class="stat">
            <span id="stat2-label">指標 B:</span>
            <div class="progress-bar"><div id="stat2-fill" class="progress-fill"></div></div>
            <span id="stat2-val">--</span>
        </div>
    </div>

    <div id="custom-message-overlay">
        <div id="custom-message-box">
            <div id="message-text">這是預設訊息。</div>
            <button id="message-close-btn">確認</button>
        </div>
    </div>

    <div id="stage-area"></div>
    <div id="action-area"></div>
</div>

<script>
    let gameState = {
        faction: "none",
        stat1: 50,
        stat2: 50,
        currentStep: "intro_1",
        seats: {
            west: null,  
            north: null, 
            south: null, 
            east: null   
        }
    };

    const allCharacters = [
        { id: "xiangyu_xiangbo", name: "項羽/項伯", emoji: "🦁" },
        { id: "亞父范增", name: "亞父范增", emoji: "👴" },
        { id: "沛公劉邦", name: "沛公劉邦", emoji: "🙇‍♂️" },
        { id: "張良", name: "張良", emoji: "🧠" }
    ];

    function triggerVibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function triggerFlash() {
        const container = document.getElementById('game-container');
        container.classList.add('flash');
        setTimeout(() => container.classList.remove('flash'), 400);
    }

    function showMessage(text, callback) {
        const overlay = document.getElementById('custom-message-overlay');
        const textEl = document.getElementById('message-text');
        const closeBtn = document.getElementById('message-close-btn');
        textEl.innerText = text;
        overlay.style.display = 'flex';
        closeBtn.onclick = function() {
            overlay.style.display = 'none';
            if (callback) callback();
        };
    }

    const script = {
        intro_1: {
            title: "歷史前言：懷王之約",
            avatar: "📜",
            text: "當初楚懷王與諸將約定：「先破秦入咸陽者王之。」人人人以為項羽會拿第一，沒想到劉邦卻抄小路先一步入主關中，甚至派兵把守函谷關，企圖封鎖關中！",
            options: [{ text: "繼續閱讀歷史背景", next: "intro_2" }]
        },
        intro_2: {
            title: "歷史前言：霸王之怒",
            avatar: "😡",
            text: "項羽在前方浴血奮戰（鉅鹿之戰），好不容易打來關門前，卻發現劉邦已經「還軍霸上、約法三章」收買民心。項羽自認天下無敵，功勞竟被實力遠遜於己的劉邦搶走，登時暴跳如雷，誓言踩平漢營！",
            options: [{ text: "進入角色選擇", next: "choose_faction" }]
        },
        choose_faction: {
            title: "請選擇你的陣營",
            avatar: "⚔️",
            text: "楚漢相爭，誰領風騷？請選擇你扮演的角色：",
            options: [
                { text: "扮演【劉邦】", faction: "liubang", next: "liu_step1", class: "btn-liubang" },
                { text: "扮演【項羽】", faction: "xiangyu", next: "xiang_step1", class: "btn-xiangyu" }
            ]
        },
        liu_step1: {
            title: "劉邦線：夜訪與內鬼",
            avatar: "👴",
            text: "劉邦手下曹無傷向楚營告密，說劉邦打算在關中稱王，且秦國珠寶都歸劉邦所有，項羽聽後勃然大怒。深夜，楚營的項伯因與張良有舊情，連夜跑來漢軍通風報信。這攸關漢軍生死，身為劉邦你打算如何應對？",
            options: [
                { text: "「快拉攏他！我要兄事之，奉卮酒為壽，結為姻親！」", next: "liu_step2" },
                { text: "「怕什麼？叫樊噲帶兵埋伏，直接在帳後砍了項伯！」", next: "end_liu_die1" }
            ]
        },
        liu_step2: {
            title: "劉邦線：赴宴謝罪",
            avatar: "🎪",
            text: "靠著項伯回去說情，楚軍暫緩進攻。隔天你帶著張良等人親赴鴻門向項羽謝罪。進入帳篷後，即將開始排定決定生死的「鴻門宴座次」...",
            options: [{ text: "走入帳中，排定宴會座次", next: "seating_game" }]
        },
        xiang_step1: {
            title: "項羽線：內鬼告密",
            avatar: "🦁",
            text: "你率領四十萬大軍駐紮鴻門。聽聞劉邦捷足先登且派兵守關，你大怒。此時曹無傷又來告密說劉邦想在關中稱王。你決定？",
            options: [
                { text: "勃然大怒：「旦日饗士卒，為擊破沛公軍！」", next: "xiang_step2" },
                { text: "不以為意：「劉邦向來膽小，隨他去吧。」繼續喝酒。", next: "end_xiang_fail1" }
            ]
        },
        xiang_step2: {
            title: "項羽線：叔父說情",
            avatar: "👴",

            options: [
                { text: "覺得有理，答應項伯明天見面時好好對待劉邦。", next: "xiang_step3" },
                { text: "怒斥私見漢軍軍師的項伯：「吃裡扒外的傢伙！」維持明天進攻計畫。", next: "end_xiang_fail2" }
            ]
        },
        xiang_step3: {
            title: "項羽線：劉邦謝罪",
            avatar: "🙇‍♂️",
            text: "隔日，劉邦卑躬屈膝地帶著張良來向你謝罪，語氣極度諂媚，你戒心大失，得意洋洋地說是曹無傷告密的。隨後，你傳令擺設酒宴...",
            options: [{ text: "傳令設宴，排定室內座次", next: "seating_game" }]
        },
        seating_game: {
            title: "【考驗】鴻門宴座次陣法",
            avatar: "📐",
            text: "古代室內座次尊卑嚴格：『項王、項伯東向坐；亞父南向坐；沛公北向坐；張良西向侍。』請拖移上方的角色，將他們排定到正確的座位上！(可任意拖移交換或拉出重置)",
            isSeatingLevel: true
        },
        hongmen_climax: {
            title: "第三章：項莊舞劍",
            avatar: "🤺",
            text: "宴席上氣氛詭譎。亞父范增瘋狂舉起玉玦暗示項羽殺劉邦，項羽卻裝死不理。范增等不下去，喚出項莊「拔劍起舞，意在沛公！」項伯也拔劍護劉邦，劍尖直逼劉邦！",
            onEnter: () => {
                triggerVibrate([200, 100, 200]);
                triggerFlash();
            },
            options: [
                { text: "【若你是劉邦】快叫帳外持盾的樊噲進來救駕！", next: "hongmen_end", reqFaction: "liubang" },
                { text: "【若你是劉邦】繼續坐著喝悶酒，賭項伯會一直幫我擋...", next: "end_liu_die3", reqFaction: "liubang" },
                { text: "【若你是項羽】看著項伯也拔劍保護劉邦，你選擇默許這場鬧劇。", next: "hongmen_end", reqFaction: "xiangyu" },
                { text: "【若你是項羽】拍案叫絕，親自拔劍幫項莊一起砍劉邦！", next: "end_xiang_win1", reqFaction: "xiangyu" }
            ]
        },
        hongmen_end: {
            title: "第四章：尿遁與碎玉斗",
            avatar: "🏃‍♂️",
            text: "樊噲闖帳怒斥項羽。劉邦趁機藉口「如廁」開溜，抄小路逃回漢營。張良留下來替劉邦獻上白璧給項羽、玉斗給范增。范增氣得拔劍將玉斗撞得粉碎！",
            onEnter: () => {
                triggerVibrate(1000); 
                triggerFlash();
            },
            options: [{ text: "查看【歷史最終結局】", next: "game_final_summary" }]
        },
        end_liu_die1: {
            title: "【劉邦線 Bad End：莽夫行徑】", avatar: "💀",
            text: "你竟然想砍項伯？項伯逃回楚營，項羽得知後提早發兵，四十萬大軍直接踏平漢營，你當場陣亡。(劉邦當時實力懸遜，唯有隱忍結交項伯才是生路)",
            options: [{ text: "重回歷史起點", next: "intro_1" }]
        },
        end_liu_die3: {
            title: "【劉邦線 Bad End：人肉串燒】", avatar: "💀",
            text: "項伯雖然拼命用身體擋劍，但久戰力竭。項莊看準空檔一劍刺穿你的胸膛！",
            options: [{ text: "重回歷史起點", next: "intro_1" }]
        },
        end_xiang_fail1: {
            title: "【項羽線 Bad End：錯失良機】", avatar: "🏳️",
            text: "你毫無警覺，劉邦悄悄在關中發展勢力、收買人心。幾年後漢軍東出，你兵敗垓下，臨江自刎。(項羽缺乏政治敏感度，白白錯失了消滅劉邦的合法藉口)",
            options: [{ text: "重回歷史起點", next: "intro_1" }]
        },
        end_xiang_fail2: {
            title: "【項羽線 Bad End：眾叛親離】", avatar: "😡",
            text: "你對親叔叔項伯大發雷霆，項軍內部產生內訌。隔天劉邦乾脆不來了，直接聯合其他諸侯反叛，你陷入腹背受敵的窘境。",
            options: [{ text: "重新選擇陣營", next: "choose_faction" }]
        },
        end_xiang_win1: {
            title: "【項羽線 幻之結局：楚霸王中原】", avatar: "🏆",
            text: "你拋棄了所謂的「婦人之仁」與「光明磊落」，與項莊聯手將劉邦斬於案前！范增狂喜。你成功消滅了最大的宿敵，歷史在此改寫！",
            options: [{ text: "重新選擇陣營", next: "choose_faction" }]
        },
        game_final_summary: {
            title: "🏆 歷史之軌跡（遊戲通關）", avatar: "📜",
            text: "這就是歷史上真實的【鴻門宴】。劉邦靠著極致的隱忍、張良的計謀、樊噲的勇猛成功尿遁逃脫；項羽則因為自傲、聽信項伯、不聽范增之言，放虎歸山。這場宴會成為楚漢戰爭強弱易勢的關鍵轉折點！",
            options: [{ text: "挑戰另一個主角的視角", next: "choose_faction" }]
        }
    };

    function updatePage() {
        const data = script[gameState.currentStep];
        if (!data) return;
        
        const s1Label = document.getElementById('stat1-label');
        const s2Label = document.getElementById('stat2-label');
        const s1Fill = document.getElementById('stat1-fill');
        const s2Fill = document.getElementById('stat2-fill');
        const s1Val = document.getElementById('stat1-val');
        const s2Val = document.getElementById('stat2-val');
        
        if (gameState.faction === "liubang") {
            s1Label.innerText = "劉邦危機:"; s2Label.innerText = "項羽好感:";
            if(gameState.currentStep === "liu_step1") { gameState.stat1 = 40; gameState.stat2 = 50; }
            if(gameState.currentStep === "liu_step2") { gameState.stat1 = 20; gameState.stat2 = 70; }
            if(gameState.currentStep === "hongmen_climax") { gameState.stat1 = 90; gameState.stat2 = 30; }
        } else if (gameState.faction === "xiangyu") {
            s1Label.innerText = "霸王野心:"; s2Label.innerText = "亞父信任:";
            if(gameState.currentStep === "xiang_step1") { gameState.stat1 = 80; gameState.stat2 = 50; }
            if(gameState.currentStep === "xiang_step2") { gameState.stat1 = 50; gameState.stat2 = 40; }
            if(gameState.currentStep === "xiang_step3") { gameState.stat1 = 30; gameState.stat2 = 20; }
            if(gameState.currentStep === "hongmen_climax") { gameState.stat1 = 20; gameState.stat2 = 10; }
        } else {
            s1Label.innerText = "歷史進度:"; s2Label.innerText = "漢營戒備:";
            gameState.stat1 = (gameState.currentStep==="intro_1")?25:50; gameState.stat2 = 50;
        }

        s1Fill.style.width = gameState.stat1 + "%"; s1Val.innerText = gameState.stat1 + "%";
        s2Fill.style.width = gameState.stat2 + "%"; s2Val.innerText = gameState.stat2 + "%";

        const stageArea = document.getElementById('stage-area');
        stageArea.innerHTML = "";
        const btnArea = document.getElementById('action-area');
        btnArea.innerHTML = "";

        if (data.isSeatingLevel) {
            stageArea.innerHTML = `
                <div id="chapter-title">${data.title}</div>
                <div id="story-text">${data.text}</div>
            `;
            renderSeatingLevelDragAndDrop(stageArea, btnArea);
            return;
        }

        stageArea.innerHTML = `
            <div id="chapter-title">${data.title}</div>
            <div id="character-avatar">${data.avatar}</div>
            <div id="story-text">${data.text}</div>
        `;

        if (data.onEnter) data.onEnter();

        data.options.forEach(opt => {
            if (opt.reqFaction && opt.reqFaction !== gameState.faction) return;
            const button = document.createElement('button');
            button.className = "btn " + (opt.class || "");
            button.innerText = opt.text;
            button.onclick = () => {
                if (opt.faction) gameState.faction = opt.faction;
                gameState.currentStep = opt.next;
                updatePage();
            };
            btnArea.appendChild(button);
        });
    }

    // ==================== [核心修改] 進階拖移交換與隱忍邏輯 ====================
    let dragSourceInfo = null; // 用於儲存拖移來源 { type: 'source'|'seat', id: charId, direction: 'west'等 }
    let ghostElement = null;
    let lastDragOverSlot = null;

    function renderSeatingLevelDragAndDrop(stage, buttons) {
        document.body.addEventListener('touchmove', preventDefault, { passive: false });
        gameState.seats = { west: null, north: null, south: null, east: null };

        const seatingContainer = document.createElement('div');
        seatingContainer.id = "seating-level-container";

        // 1. 來源區
        const sourceZone = document.createElement('div');
        sourceZone.id = "character-source-zone";
        seatingContainer.appendChild(sourceZone);

        // 2. 網格區
        const grid = document.createElement('div');
        grid.id = "seating-grid";
        grid.innerHTML = `
            <div class="seat-slot empty-cell"></div>
            <div class="seat-slot drop-target" data-direction="north">北面南(次尊)<div class="drop-slot-content"></div></div>
            <div class="seat-slot empty-cell"></div>

            <div class="seat-slot drop-target" data-direction="west">西面東(最尊)<div class="drop-slot-content"></div></div>
            <div class="seat-center">宴會<br>中央</div>
            <div class="seat-slot drop-target" data-direction="east">東面西(最卑)<div class="drop-slot-content"></div></div>

            <div class="seat-slot empty-cell"></div>
            <div class="seat-slot drop-target" data-direction="south">南面北(卑位)<div class="drop-slot-content"></div></div>
            <div class="seat-slot empty-cell"></div>
        `;
        seatingContainer.appendChild(grid);
        stage.appendChild(seatingContainer);

        // 刷新渲染角色與座位狀態
        refreshDragLayout();

        // 提交按鈕
        const submitBtn = document.createElement('button');
        submitBtn.className = "btn";
        submitBtn.style.backgroundColor = "var(--accent-gold)";
        submitBtn.style.color = "#000";
        submitBtn.innerText = "📜 擺設完成，開席檢驗！";
        submitBtn.onclick = checkSeatingDragAnswer;
        buttons.appendChild(submitBtn);
    }

    function preventDefault(e) {
        if (e.touches && e.touches.length > 1) return;
        if (e.preventDefault) e.preventDefault();
    }

    // 重新根據目前的 gameState.seats 繪製角色位置與上方顯示狀態
    function refreshDragLayout() {
        const sourceZone = document.getElementById('character-source-zone');
        sourceZone.innerHTML = "";

        // 渲染上方角色
        allCharacters.forEach(char => {
            const charEl = document.createElement('div');
            charEl.className = "draggable-character";
            charEl.setAttribute('draggable', 'true');
            charEl.dataset.charId = char.id;
            charEl.innerHTML = `
                <div class="char-avatar">${char.emoji}</div>
                <div class="char-name">${char.name}</div>
            `;

            // 如果該角色已經被分配到某個座位，則在上方區「隱藏」
            const isPlaced = Object.values(gameState.seats).includes(char.id);
            if (isPlaced) {
                charEl.classList.add('placed');
            } else {
                // 只有沒被放下去的角色才可以從上方拖移
                bindDragEvents(charEl, { type: 'source', id: char.id });
            }

            sourceZone.appendChild(charEl);
        });

        // 渲染座位網格
        const grid = document.getElementById('seating-grid');
        grid.querySelectorAll('.drop-target').forEach(slot => {
            const dir = slot.dataset.direction;
            const charId = gameState.seats[dir];
            const contentZone = slot.querySelector('.drop-slot-content');
            
            // 重置樣式
            slot.classList.remove('occupied');
            slot.removeAttribute('draggable');
            contentZone.innerHTML = "";

            // 解綁之前的事件，避免重複
            const newSlot = slot.cloneNode(true);
            slot.parentNode.replaceChild(newSlot, slot);

            // PC 端的目標接收事件
            newSlot.addEventListener('dragover', (e) => { e.preventDefault(); newSlot.classList.add('drag-over'); });
            newSlot.addEventListener('dragleave', () => newSlot.classList.remove('drag-over'));
            newSlot.addEventListener('drop', (e) => {
                e.preventDefault();
                newSlot.classList.remove('drag-over');
                if(dragSourceInfo) executeMoveAction(dragSourceInfo, { type: 'seat', direction: dir });
            });

            if (charId) {
                const charData = allCharacters.find(c => c.id === charId);
                newSlot.classList.add('occupied');
                newSlot.setAttribute('draggable', 'true');
                newSlot.querySelector('.drop-slot-content').innerHTML = `
                    <div class="char-avatar">${charData.emoji}</div>
                    <div class="char-name">${charData.name}</div>
                `;
                // 座位上有人的話，此座位可以再度被拖移出去
                bindDragEvents(newSlot, { type: 'seat', id: charId, direction: dir });
            }
        });

        // 允許將座位上的人拖回到「上方來源區」釋放
        sourceZone.addEventListener('dragover', (e) => e.preventDefault());
        sourceZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if(dragSourceInfo && dragSourceInfo.type === 'seat') {
                executeMoveAction(dragSourceInfo, { type: 'source' });
            }
        });
    }

    // 統一綁定 PC 拖移與手機觸控事件
    function bindDragEvents(element, sourceInfo) {
        // --- PC 端 ---
        element.addEventListener('dragstart', (e) => {
            dragSourceInfo = sourceInfo;
            element.style.opacity = '0.4';
            e.dataTransfer.setData('text/plain', sourceInfo.id);
        });
        element.addEventListener('dragend', () => {
            element.style.opacity = '1';
        });

        // --- 手機觸控端 (防滑動偏移) ---
        element.addEventListener('touchstart', (e) => {
            dragSourceInfo = sourceInfo;
            element.style.opacity = '0.4';

            ghostElement = element.cloneNode(true);
            ghostElement.id = "ghost-element";
            ghostElement.style.position = "fixed";
            ghostElement.style.opacity = "0.7";
            ghostElement.style.pointerEvents = "none";
            ghostElement.style.zIndex = "1000";
            // 修正克隆座位時的大小
            ghostElement.style.width = element.offsetWidth + "px";
            ghostElement.style.height = element.offsetHeight + "px";
            document.body.appendChild(ghostElement);

            moveGhost(e.touches[0]);
        });

        element.addEventListener('touchmove', (e) => {
            if (!ghostElement) return;
            moveGhost(e.touches[0]);

            const touch = e.touches[0];
            ghostElement.style.visibility = 'hidden';
            const targetUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
            ghostElement.style.visibility = 'visible';

            const currentSlot = targetUnderTouch ? targetUnderTouch.closest('.drop-target') : null;
            const currentSourceZone = targetUnderTouch ? targetUnderTouch.closest('#character-source-zone') : null;

            if (lastDragOverSlot && lastDragOverSlot !== currentSlot) {
                lastDragOverSlot.classList.remove('drag-over');
            }
            if (currentSlot) {
                currentSlot.classList.add('drag-over');
            }
            lastDragOverSlot = currentSlot;
        });

        element.addEventListener('touchend', (e) => {
            if (!dragSourceInfo || !ghostElement) return;
            element.style.opacity = '1';

            const touch = e.changedTouches[0];
            ghostElement.style.visibility = 'hidden';
            const targetUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
            ghostElement.style.visibility = 'visible';

            const targetSlot = targetUnderTouch ? targetUnderTouch.closest('.drop-target') : null;
            const targetSourceZone = targetUnderTouch ? targetUnderTouch.closest('#character-source-zone') : null;

            if (targetSlot) {
                targetSlot.classList.remove('drag-over');
                executeMoveAction(dragSourceInfo, { type: 'seat', direction: targetSlot.dataset.direction });
            } else if (targetSourceZone || isOutsideGrid(touch)) {
                // 如果拖回上方來源區，或放開在座位網格之外，則判定為「拿回上方」
                executeMoveAction(dragSourceInfo, { type: 'source' });
            }

            if (ghostElement && ghostElement.parentNode) ghostElement.parentNode.removeChild(ghostElement);
            ghostElement = null;
            dragSourceInfo = null;
            lastDragOverSlot = null;
        });
    }

    function moveGhost(touch) {
        if (!ghostElement) return;
        const x = touch.clientX - ghostElement.offsetWidth / 2;
        const y = touch.clientY - ghostElement.offsetHeight / 2;
        ghostElement.style.left = x + "px";
        ghostElement.style.top = y + "px";
    }

    function isOutsideGrid(touch) {
        const grid = document.getElementById('seating-grid');
        const rect = grid.getBoundingClientRect();
        return (touch.clientX < rect.left || touch.clientX > rect.right || touch.clientY < rect.top || touch.clientY > rect.bottom);
    }

    //核心：執行移動、對調邏輯
    function executeMoveAction(source, target) {
		if (dragSourceInfo) {
			// 尋找當前正在被拖移的 DOM 元素並恢復其透明度
			let sourceEl = null;
			if (source.type === 'source') {
				sourceEl = document.querySelector(`.draggable-character[data-char-id="${source.id}"]`);
			} else if (source.type === 'seat') {
				sourceEl = document.querySelector(`.drop-target[data-direction="${source.direction}"]`);
			}
			if (sourceEl) sourceEl.style.opacity = '1';
		}
	
        // 情況 1：從某處移到【上方來源區】 (意即釋放、清除座位)
        if (target.type === 'source') {
            if (source.type === 'seat') {
                gameState.seats[source.direction] = null;
            }
        }
        
        // 情況 2：移到某個【座位】
        else if (target.type === 'seat') {
            const occupantId = gameState.seats[target.direction]; // 目標位置目前的人

            if (source.type === 'source') {
                // A. 從上方拖到座位
                if (occupantId) {
                    // 目標座位有人 ->「對調」，原本的人會回到上方 (因為上方原本放 source.id 的現在空出來了)
                    gameState.seats[target.direction] = source.id;
                } else {
                    // 目標座位沒人 -> 直接放入
                    gameState.seats[target.direction] = source.id;
                }
            } 
            else if (source.type === 'seat') {
                // B. 從座位A 拖到 座位B
                if (source.direction !== target.direction) {
                    if (occupantId) {
                        // 兩個座位都有人 ->「位置互換」
                        gameState.seats[source.direction] = occupantId;
                        gameState.seats[target.direction] = source.id;
                    } else {
                        // 目標座位沒人 -> 原座位清空，新座位放入
                        gameState.seats[source.direction] = null;
                        gameState.seats[target.direction] = source.id;
                    }
                }
            }
        }

        // 重新繪製畫面與事件綁定
        refreshDragLayout();
    }

    // 驗證答案
    function checkSeatingDragAnswer() {
        const s = gameState.seats;
        if (s.west === "xiangyu_xiangbo" && s.north === "亞父范增" && s.south === "沛公劉邦" && s.east === "張良") {
            triggerVibrate(200);
            document.body.removeEventListener('touchmove', preventDefault);
            showMessage("🎯 完全正確！\n\n項王、項伯東向坐；亞父南向坐；沛公北向坐；張良西向侍。尊卑井然有序，這場表面和平、內含殺機的酒宴正式開始！", function() {
                gameState.currentStep = "hongmen_climax";
                updatePage();
            });
        } else {
            triggerVibrate(300);
            triggerFlash();
            showMessage("❌ 座次尊卑排錯了！\n\n提示：\n1. 項羽唯我獨尊，佔據最尊貴的『坐西朝東（西面東）』位。\n2. 劉邦向項羽稱臣謝罪，坐在卑位『坐南朝北（南面北）』。\n3. 亞父范增地位崇高坐北朝南；張良身為隨從坐在最卑微的東面西。\n\n你可以直接拖移他們進行對調，或者扔到網格外面重置。再試一次！");
        }
    }

    updatePage();
</script>
